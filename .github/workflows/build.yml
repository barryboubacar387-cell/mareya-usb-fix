name: Compilation et tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.0.0). Laisser vide pour seulement compiler et tester."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "0.0.0" }
          dotnet build src/MareyaUSBFix/MareyaUSBFix.csproj -c Release -p:Version=$v

      - name: Test sur une clé infectée simulée
        shell: pwsh
        run: ./tests/simulate-infection.ps1 -Exe src/MareyaUSBFix/bin/Release/net48/MareyaUSBFix.exe

      - name: Captures d'écran de l'interface
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $p = Start-Process src/MareyaUSBFix/bin/Release/net48/MareyaUSBFix.exe -ArgumentList "/capture", "$env:RUNNER_TEMP\captures" -Wait -PassThru
          Get-ChildItem "$env:RUNNER_TEMP\captures" | ForEach-Object { Write-Host "$($_.Name) $($_.Length) octets" }
          Set-Location "$env:RUNNER_TEMP\captures"
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Captures d'écran ($env:GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:captures

      - name: Préparer le fichier à télécharger
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/MareyaUSBFix/bin/Release/net48/MareyaUSBFix.exe dist/
          Copy-Item docs/GUIDE.md dist/GUIDE.md

      - uses: actions/upload-artifact@v4
        with:
          name: MareyaUSBFix
          path: dist/

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ inputs.version != '' && format('Mareya USB Fix {0}', inputs.version) || format('Mareya USB Fix {0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          files: dist/MareyaUSBFix.exe
          body_path: docs/RELEASE_NOTES.md
          make_latest: true
